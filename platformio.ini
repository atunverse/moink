; 墨印 MoInk — 重构版固件 (R 系列)
; ESP32-C3 SUPERMINI + 四色墨水屏 A0/A1 (768x552), ESP-IDF framework
;
; 与旧 eink-frame 项目的差异：
;   - 全新 env 名 moink（旧 env eink_m1_a0 已废弃）
;   - 移除 WiFi STA / 配网 / 拉图，固件只跑 SoftAP 热点传图
;   - 保留 OTA 双槽 + web 分区页面热更
;   - flash 时序沿用已验证的 DIO 40M（QIO 80M 留作后续实测优化项）
[env:moink]
platform = espressif32
framework = espidf
board = esp32-c3-devkitm-1
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
monitor_speed = 115200
